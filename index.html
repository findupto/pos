<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f17" />
    <link rel="stylesheet" href="/premium.css" />
    <title>Findupto POS</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (event) {
        if (document.getElementById('posFatalError')) return;
        var box=document.createElement('div'); box.id='posFatalError';
        box.style='position:fixed;inset:20px;z-index:99999;background:#0d111a;color:#fff;border:1px solid #5a6475;border-radius:16px;padding:24px;font:14px Arial;box-shadow:0 25px 80px #000';
        box.innerHTML='<h2 style="margin-top:0">Findupto POS recovered from a renderer error</h2><p style="color:#aeb8c7">The application stopped rendering this screen. The error has been captured so the POS never appears as an unexplained black page.</p><pre style="white-space:pre-wrap;color:#ff9b9b">'+String(event.error?.stack||event.message||'Unknown renderer error').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</pre><button onclick="location.reload()" style="padding:10px 16px;border:0;border-radius:8px;background:#7569e7;color:white;font-weight:700">Reload POS</button>';
        document.body.appendChild(box);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module" src="/src/aiOverlay.js"></script>
    <script type="module" src="/src/themeManager.js"></script>
    <script type="module" src="/src/authGate.js"></script>
  </body>
</html>
